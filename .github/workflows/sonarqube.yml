name: SonarQube

on:
  workflow_call:
    inputs:
      pr-key:
        type: string
        required: false
        default: ""
      pr-branch:
        type: string
        required: false
        default: ""
      pr-base:
        type: string
        required: false
        default: ""
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Todo step abaixo e condicionado a `env.SONAR_TOKEN != ''`. Sem o secret o job
      # ficava VERDE sem escanear nada: o mecanismo anti-recorrencia
      # (D-2026-07-30-sonar-zero-issues-2) desaparecia em SILENCIO. Este guard troca o
      # silencio por sinal (D-2026-07-30-sonar-zero-issues-10): falha no contexto que DEVE
      # ter o secret (repo de origem) e avisa alto onde a ausencia e legitima e nao ha o
      # que consertar - fork (secrets nao sao expostos a PR de fork) e Dependabot (usa o
      # cofre proprio de secrets).
      - name: Assert the scan is not silently skipped
        if: env.SONAR_TOKEN == ''
        env:
          TOKEN_EXPECTED: ${{ github.repository == 'slipalison/TranslateReader' && github.actor != 'dependabot[bot]' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: |
          if [ "$TOKEN_EXPECTED" = "true" ]; then
            echo "::error::SONAR_TOKEN is missing on the origin repository: the SonarCloud scan and the Quality Gate did NOT run (D-2026-07-30-sonar-zero-issues-2). Restore the repository secret."
            exit 1
          fi
          echo "::warning::SONAR_TOKEN unavailable (fork or Dependabot run): the SonarCloud scan and the Quality Gate were skipped for this run."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dotnet-sonarscanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_PR_KEY: ${{ inputs.pr-key }}
          SONAR_PR_BRANCH: ${{ inputs.pr-branch }}
          SONAR_PR_BASE: ${{ inputs.pr-base }}
        run: |
          # Waivers auditaveis (D-2026-07-30-sonar-zero-issues-3 mecanismo (b),
          # D-2026-07-30-sonar-zero-issues-4): as duas regras abaixo apontam para
          # decisoes de produto em index.html, nao para defeitos.
          #   Web:S7926 -> user-scalable=no e requisito do modo Paginated (viewport fixo);
          #                WCAG 1.4.4 ja atendido pela tipografia configuravel.
          #   css:S4667 -> <style id="reader-theme"> e vazio por design, populado em
          #                runtime pelo CSS que o ThemeEngine gera.
          # sonar.exclusions: o scanner .NET indexa como fonte MAIN todo arquivo fora de
          # csproj (e por isso que o JS de Resources/Raw e medido sem buildar o projeto
          # MAUI). Sem esta exclusao as ~500 linhas de test/js entrariam no denominador de
          # coverage a 0% - o Node exclui test file do relatorio por padrao - e tambem
          # renderiam issues de analisador em codigo de teste. Nao contradiz
          # D-2026-07-31-coverage-90-1, que rejeitou excluir o JS de PRODUCAO.
          args=(/k:"slipalison_TranslateReader" /o:"slipalison"
                /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN"
                /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
                /d:sonar.javascript.lcov.reportPaths=TestResults/js-lcov.info
                /d:sonar.exclusions="test/js/**"
                /d:sonar.issue.ignore.multicriteria=e1,e2
                /d:sonar.issue.ignore.multicriteria.e1.ruleKey="Web:S7926"
                /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/index.html"
                /d:sonar.issue.ignore.multicriteria.e2.ruleKey="css:S4667"
                /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/index.html"
                /d:sonar.qualitygate.wait=true)
          if [ -n "$SONAR_PR_KEY" ]; then
            args+=(/d:sonar.pullrequest.key="$SONAR_PR_KEY"
                   /d:sonar.pullrequest.branch="$SONAR_PR_BRANCH"
                   /d:sonar.pullrequest.base="$SONAR_PR_BASE")
          fi
          dotnet-sonarscanner begin "${args[@]}"

      - name: Build Core
        if: env.SONAR_TOKEN != ''
        run: dotnet build src/TranslateReader.Core/TranslateReader.Core.csproj -c Release

      - name: Test with OpenCover coverage
        if: env.SONAR_TOKEN != ''
        run: dotnet test test/TranslateReader.Tests/TranslateReader.Tests.csproj -c Release --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults

      # Cobertura dos 4 scripts do WebView (D-2026-07-31-coverage-90-1/-2): eles sao fonte
      # MAIN para o Sonar mas nao pertencem a nenhum csproj, entao o lcov do node:test e a
      # unica origem possivel. O reporter nao cria o diretorio de destino.
      - name: Test WebView scripts with lcov coverage
        if: env.SONAR_TOKEN != ''
        run: |
          mkdir -p TestResults
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=TestResults/js-lcov.info test/js/

      # Mecanismo anti-recorrencia (D-2026-07-30-sonar-zero-issues-2): com
      # sonar.qualitygate.wait=true o scanner espera o Quality Gate do SonarCloud e falha o
      # job se ele reprovar. Como `sonarqube` ja e check obrigatorio (pipeline.yml), qualquer
      # PR futuro que reintroduza bug/vulnerability/code smell bloqueante em New Code trava
      # antes do merge, em vez de so aparecer na UI do SonarCloud.
      # A flag vive na fase `begin` (D-2026-07-30-sonar-zero-issues-11): o SonarScanner for
      # .NET 11.2.1 rejeita `sonar.qualitygate.wait` no `end` com
      # "This setting is not valid in the end phase in this version of the C# plugin",
      # saindo com exit 1 sem sequer consultar o Quality Gate.
      - name: End SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
