name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test test/TranslateReader.Tests/TranslateReader.Tests.csproj -c Release

  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build Windows app
        run: dotnet build src/TranslateReader/TranslateReader.csproj -c Release -f net10.0-windows10.0.19041.0

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android app
        run: dotnet build src/TranslateReader/TranslateReader.csproj -c Release -f net10.0-android

  # build-ios intentionally absent: the 10 tr_llama_* entry points declared in
  # src/TranslateReader/Platforms/iOS/LlamaNativeAccess.cs are not exported by the pinned
  # llama.cpp XCFramework (b10453) -- confirmed by inspecting the fetched headers and binary,
  # not inferred. On full-AOT iOS this is a deterministic link failure (undefined symbols),
  # not a risk that CI would sometimes catch. D-2026-08-16-llm-mobile-10's rule is that a red
  # job is never committed because that assumed an *unknowable* outcome from this Windows
  # machine; this failure is knowable without macOS, so the job stays out until the native
  # symbol layer exists (D-2026-08-16-llm-mobile-12).
