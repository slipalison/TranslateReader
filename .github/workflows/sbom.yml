name: SBOM

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 2"

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required by dependency-snapshot: true — the
      # sbom-action submits the SBOM to the GitHub Dependency Submission
      # API, which writes to the repository's dependency graph.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          dependency-snapshot: true
          # Uploaded manually below so the artifact retention is explicit.
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30
